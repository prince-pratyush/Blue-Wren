[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blue-wren"
version = "0.1.0"
description = "Evidence-linked investment research review workspace"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Prince Pratyush" }]
dependencies = [
  "fastapi>=0.116,<1",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=7.4,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["blue_wren"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
